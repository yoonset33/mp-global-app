  if (sc && keepScroll) sc.scrollTop = keepScroll;
  lastViewKey = key;
  document.documentElement.lang = state.lang;
  const splash = app.querySelector(".splash");
  $(".status-bar").classList.toggle("light", !!splash);
  setClock();
}

function onClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  if (shopClick(act, id)) return;
  if (roleClick(act, id, btn)) return;
  if (act === "lang") {
    state.lang = id;
    safeSet("mpg_lang", id);
    state.langSheet = false;
    render();
  } else if (act === "lang-sheet") {
    state.langSheet = true;
    render();
  } else if (act === "close-sheet") {
    if (e.target !== btn && btn.classList.contains("sheet-backdrop")) return; // clicks inside the sheet
    state.langSheet = false;
    render();
  } else if (act === "goto") {
    if (id === "register" && state.user) push("register"); else go(id);
  } else if (act === "back") {
    back();
  } else if (act === "home") {
    resetNav();
    if (state.user) { state.screen = "app"; state.tab = "home"; render(); }
    else go("auth");
  } else if (act === "tab") {
    resetNav();
    state.tab = id;
    state.screen = "app";
    state.matchExpert = null;
    state.helpFromSanjae = false;
    render();
  } else if (act === "demo-login") {
    resetNav();
    state.user = { ...DEMO_OCR, phone: "010-5555-1212", workplace: "부여 한들농장" };
    saveUser();
    state.screen = "app";
    state.tab = "home";
    render();
  } else if (act === "pick-photo") {
    $("#passportFile")?.click();
  } else if (act === "run-ocr" || act === "mock-ocr") {
    runOcr();
  } else if (act === "sample-ocr") {
    state.passportImage = SAMPLE_PASSPORT;
    state.passportSource = SAMPLE_PASSPORT;
    state.passportIsSample = true;
    runOcr();
  } else if (act === "apply-ocr") {
    applyOcr();
  } else if (act === "manual") {
    const form = $("#registerForm");
    if (form) { form.scrollIntoView({ behavior: "smooth", block: "start" }); form.querySelector("input")?.focus({ preventScroll: true }); }
  } else if (act === "help-cat") {
    push(id === "accident" ? "sanjae" : "help-form", { helpCategory: id, tab: "help", helpFromSanjae: false, matchExpert: null });
  } else if (act === "sanjae") {
    push("sanjae", { tab: "help", matchExpert: null });
  } else if (act === "sj-step") {
    const n = Math.max(0, Math.min(SANJAE_STEPS.length - 1, Number(id) || 0));
    if (state.screen === "sanjae-step") replaceScreen("sanjae-step", { sjStep: n }); // prev/next: one back goes to the list
    else push("sanjae-step", { sjStep: n });
  } else if (act === "sj-item") {
    push("sanjae-item", { sjItemId: id });
  } else if (act === "sj-item-next") {
    replaceScreen("sanjae-item", { sjItemId: id });
  } else if (act === "sj-docs") {
    push("sanjae-docs");
  } else if (act === "sj-contacts") {
    push("sanjae-contacts");
  } else if (act === "sj-toggle") {
    if (state.sanjae.checked[id]) delete state.sanjae.checked[id];
    else state.sanjae.checked[id] = true;
    saveSanjae();
    render();
  } else if (act === "sj-reset") {
    if (window.confirm(t("sjResetConfirm"))) {
      state.sanjae = { checked: {}, updatedAt: null };
      saveSanjae();
      render();
      toast(t("sjResetDone"));
    }
  } else if (act === "sj-request") {
    push("help-form", { helpCategory: "accident", helpFromSanjae: true, matchExpert: null });
  } else if (act === "sj-match") {
    push("matching", { helpCategory: "accident", matchExpert: id });
  } else if (act === "directory") {
    state.dirQuery = "";
    push("directory");
  } else if (act === "dir-list") {
    push("dir-list", { dirList: dirParseList(id) });
  } else if (act === "dir-open") {
    if (!DIRECTORY.some((x) => x.id === id)) return;
    push("dir-detail", { dirId: id });
  } else if (act === "dir-near-all") {
    state.dirList = { kind: "near", cat: null };
    render();
  } else if (act === "dir-fav") {
    const on = state.dirFav.includes(id);
    state.dirFav = on ? state.dirFav.filter((x) => x !== id) : [...state.dirFav, id];
    saveDirFav();
    render();
    toast(t(on ? "dirFavRemoved" : "dirFavAdded"));
  } else if (act === "expert") {
    push("expert", { expertRef: id });
  } else if (act === "req-open") {
    push("request", { reqIdx: Number(id) || 0 });
  } else if (act === "sos") {
    push("emergency");
  } else if (act === "emg-pick") {
    const kind = id === "112" ? "112" : "119";
    // sensible default situation for the chosen line; the user can change it
    if (!state.emgSits.length || state.emgKind !== kind) state.emgSits = kind === "112" ? ["crime"] : ["injury"];
    state.emgNatOpen = false;
    push("emergency-call", { emgKind: kind });
  } else if (act === "emg-sit") {
    state.emgSits = state.emgSits.includes(id) ? state.emgSits.filter((x) => x !== id) : [...state.emgSits, id];
    render();
  } else if (act === "emg-nat") {
    const prof = state.user && emgMatchNation(state.user.nationality);
    if (prof && prof.id === id) { state.emgNat = ""; safeDel(EMG_NAT_KEY); } // back to the passport nationality
    else { state.emgNat = id; safeSet(EMG_NAT_KEY, id); }
    state.emgNatOpen = false;
    render();
  } else if (act === "emg-nat-toggle") {
    state.emgNatOpen = !state.emgNatOpen;
    render();
  } else if (act === "emg-eng") {
    state.emgEng = !state.emgEng;
    render();
  } else if (act === "emg-speak") {
    emgSpeak();
  } else if (act === "emg-info") {
    push("emg-info", { emgInfoId: id });
  } else if (act === "sample-call") {
    toast(t("sampleCall"));
  } else if (act === "chip") {
    btn.parentElement.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
    btn.classList.add("on");
  } else if (act === "toast") {
    toast(btn.dataset.msg);
  } else if (act === "logout") {
    resetNav();
    state.user = null;
    safeDel("mpg_user");
    state.form = { ...EMPTY_FORM };
    state.passportImage = state.passportSource = null;
    state.passportIsSample = false;
    state.ocr = { status: "idle", step: "", progress: 0, result: null, review: null, error: null };
    go(null);
  }
}

// Keep typed values in state so OCR re-renders never wipe them.
function onInput(e) {
  const el = e.target;
  roleInput(el);
  if (el.hasAttribute && el.hasAttribute("data-dir-q")) {
    // update only the list so the search box keeps focus while typing
    state.dirQuery = el.value;
    updateDirBody();
    return;
  }
  if (el.hasAttribute && el.hasAttribute("data-emg-loc")) {
    state.emgLoc = el.value;
    emgUpdateScript();
    return;
  }
  if (el.form && el.form.dataset.form === "register" && el.name) state.form[el.name] = el.value;
  if (el.dataset.review && state.ocr.review) {
    state.ocr.review[el.dataset.review] = el.value;
    state.ocr.review._edited[el.dataset.review] = true;
  }
}

function onChange(e) {
  if (e.target.dataset && e.target.dataset.dirSel) {
    state.dirList = { ...(state.dirList || {}), sgg: e.target.value };
    render();
    return;
  }
  if (e.target.hasAttribute && (e.target.hasAttribute("data-dir-q") || e.target.hasAttribute("data-emg-loc"))) return; // handled on input
  onInput(e);
  if (roleFile(e.target)) return;
  if (e.target.id === "passportFile" && e.target.files?.[0]) {
    const file = e.target.files[0];
    if (state.passportSource && state.passportSource.startsWith("blob:")) URL.revokeObjectURL(state.passportSource);
    const url = URL.createObjectURL(file); // stays in this browser; never uploaded
    makeThumb(url).then((thumb) => {
      if (!thumb) { toast(t("imageLoadFail")); return; }
      state.passportSource = url;
      state.passportImage = thumb;
      state.passportIsSample = false;
      toast(t("photoLoaded"));
      runOcr();
    });
    e.target.value = "";
  }
}

function onSubmit(e) {
  const form = e.target.closest("form");
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (shopSubmit(form, data)) return;
  if (roleSubmit(form, data)) return;
  if (form.dataset.form === "register") {
    resetNav();
    state.user = { ...state.form, ...data, photo: state.passportImage || "" };
    state.form = { ...state.user };
    saveUser();
    state.screen = "app";
    state.tab = "home";
    render();
    toast(t("welcome"), 1800);
    if (state.role === "worker" && !state.employer && !Repo.employerSkipped()) { state.empDraft = null; push("emp-info", { empFromSignup: true }); }
    return;
  }
  if (form.dataset.form === "dir-area") {
    state.dirArea = String(data.area || "").trim();
    if (state.dirArea) safeSet(DIR_AREA_KEY, state.dirArea); else safeDel(DIR_AREA_KEY);
    state.dirList = { kind: "near", cat: (state.dirList && state.dirList.cat) || null };
    render();
    return;
  }
  if (form.dataset.form === "help") {
    const c = CATEGORIES.find(x => x.id === state.helpCategory);
    const sj = sjTotals();
    const sjNote = c.id === "accident" && state.helpFromSanjae ? ` [${t("sjFromChecklist")} ${sj.done}/${sj.total}]` : "";
    state.requests.unshift({
      category: catName(c),
      detail: (data.detail || "(내용 없음)") + sjNote,
      place: data.place || "",
      status: "접수 · 매칭 중",
      at: new Date().toLocaleString("ko-KR"),
    });
    saveReq();
    toast(t("requestSent"));
    replaceScreen("matching", { matchExpert: null }); // back from matching returns to where the form was opened
  }
}

document.addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("change", onChange);
document.addEventListener("submit", onSubmit);
setInterval(setClock, 15000);

if (state.user) {
  state.screen = "app";
  state.form = { ...EMPTY_FORM, ...state.user };
  state.passportImage = state.user.photo || null;
}

if (state.role === "employer") { state.tab = "home"; state.screen = state.biz ? "app" : null; }

const preview = new URLSearchParams(location.search).get("screen");
if (preview) {
  const qp = new URLSearchParams(location.search);
  state.lang = qp.get("lang") || "ko";
  state.user = { ...DEMO_OCR, phone: "010-5555-1212", workplace: "부여 한들농장" };
  if (qp.get("nat") === "none") state.user.nationality = "";
  else if (qp.get("nat")) state.user.nationality = qp.get("nat");
  state.form = { ...EMPTY_FORM, ...state.user };
  state.helpCategory = "wage";
  state.requests = [{
    category: "임금체불",
    detail: "지난달 급여가 아직 입금되지 않았습니다.",
    place: "부여 한들농장",
    status: "접수 · 매칭 중",
    at: "2026. 9. 26. 오후 2:50",
  }];
  const tabFor = { sanjae: "help", "sanjae-step": "help", "sanjae-item": "help", "sanjae-docs": "help", "sanjae-contacts": "help", "help-form": "help", matching: "help", expert: "help", request: "help" };
  if (preview === "splash") { state.user = null; state.screen = null; }
  else if (preview === "auth") { state.user = null; state.screen = "auth"; }
  else if (preview === "register") { state.user = null; state.form = { ...EMPTY_FORM }; state.screen = "register"; }
  else if (SCREENS[preview]) {
    state.screen = preview;
    state.tab = tabFor[preview] || "home";
    if (preview === "help-form") state.helpCategory = qp.get("cat") || "accident";
    if (preview === "matching") state.helpCategory = qp.get("cat") || "wage";
    if (preview === "sanjae-step") state.sjStep = Number(qp.get("step") || 0);
    if (preview === "sanjae-item") state.sjItemId = qp.get("item") || SANJAE_STEPS[0].items[0].id;
    if (preview === "directory") state.dirQuery = qp.get("q") || "";
    if (preview === "dir-list") state.dirList = dirParseList(qp.get("list") || "cat:comwel");
    if (preview === "dir-detail") state.dirId = qp.get("id") || "nat-119";
    if (preview === "expert") state.expertRef = qp.get("ref") || "labor:0";
    if (preview === "request") state.reqIdx = 0;
    if (preview === "emergency-call") {
      state.emgKind = qp.get("kind") === "112" ? "112" : "119";
      state.emgSits = (qp.get("sit") || (state.emgKind === "112" ? "crime" : "injury")).split(",").filter(Boolean);
      state.emgEng = qp.get("eng") === "1";
      state.emgLoc = qp.get("loc") || "";
    }
    if (preview === "emg-info") state.emgInfoId = qp.get("id") || "112-interp";
    if (preview.startsWith("emerg") || preview === "emg-info") state.emgNat = qp.get("pick") || "";
  }
  else {
    state.screen = "app";
    state.tab = ["home", "help", "community", "jobs", "my"].includes(preview) ? preview : "home";
  }
}

render();
  </script>
</body>
