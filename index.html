<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6A1A" />
  <title>MP GLOBAL</title>
  <link rel="icon" href="data:," />
  <style>
:root {
  --orange: #ff6a1a;
  --orange-dark: #e4550b;
  --orange-soft: #fff1e8;
  --ink: #111111;
  --muted: #6b7280;
  --line: #ececec;
  --bg: #f4f5f8;
  --white: #ffffff;
  --radius: 18px;
  --shadow: 0 10px 28px rgba(17, 17, 17, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Noto Sans KR", "Noto Sans Sinhala", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1c1c1c;
  color: var(--ink);
}

.device {
  width: 390px;
  height: 844px;
  margin: 24px auto;
  background: var(--bg);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
  border: 10px solid #111;
}

.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 18px 0;
  font-size: 12px;
  font-weight: 600;
  z-index: 20;
  color: var(--ink);
}
.status-bar.light { color: #fff; }

#app {
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 88px;
}

.screen.no-tab { padding-bottom: 24px; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 42px 18px 12px;
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar h1 { font-size: 16px; letter-spacing: .4px; }
.icon-btn {
  width: 32px; height: 32px;
  border: 0; background: transparent;
  font-size: 20px; cursor: pointer;
}

.splash {
  height: 100%;
  background: linear-gradient(160deg, #ff8a3d 0%, #ff5a00 55%, #e24a00 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px 28px 36px;
}
.splash .badge {
  display: inline-block;
  background: rgba(255,255,255,.92);
  color: #333;
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
}
.splash h2 { font-size: 42px; line-height: 1.05; margin-top: 18px; font-weight: 800; }
.splash p { opacity: .92; margin-top: 10px; }

.btn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn-black { background: #111; color: #fff; }
.btn-white { background: #fff; color: #111; border: 1px solid #e5e7eb; }
.btn-orange { background: var(--orange); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); font-weight: 600; }
.btn + .btn { margin-top: 10px; }
.btn:disabled { opacity: .5; }

.hero-card {
  margin: 16px;
  background: #fff;
  border-radius: 24px;
  padding: 22px 18px 18px;
  box-shadow: var(--shadow);
  text-align: center;
}
.hero-card .kicker { font-size: 13px; color: var(--muted); }
.hero-card h2 {
  font-size: 28px;
  margin: 6px 0 14px;
  background: linear-gradient(90deg, #111 60%, #ff6a1a);
  -webkit-background-clip: text;
  background-clip: text;
}
.crew {
  height: 148px;
  border-radius: 16px;
  background: linear-gradient(180deg, #fff7f1, #ffe4d2);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin-bottom: 16px;
  overflow: hidden;
}
.crew svg { width: 86%; height: 130px; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px;
}
.tile {
  background: #fff;
  border-radius: 16px;
  padding: 14px 12px;
  box-shadow: var(--shadow);
  border: 0;
  text-align: left;
  cursor: pointer;
}
.tile .emoji { font-size: 22px; }
.tile b { display: block; margin-top: 8px; font-size: 14px; }
.tile span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }

.section { padding: 18px 16px 0; }
.section h3 { font-size: 15px; margin-bottom: 10px; }
.list-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 13px 14px;
  width: 100%;
  border: 0;
  background: #fff;
  text-align: left;
  cursor: pointer;
}
.row + .row { border-top: 1px solid var(--line); }
.row .ico {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--orange-soft);
  display: grid; place-items: center;
  font-size: 18px; flex-shrink: 0;
}
.row .meta { flex: 1; }
.row .meta b { display: block; font-size: 14px; }
.row .meta span { color: var(--muted); font-size: 12px; }
.chev { color: #c4c4c4; }

.tabbar {
  position: absolute;
  left: 12px; right: 12px; bottom: 12px;
  height: 64px;
  background: #fff;
  border-radius: 20px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  box-shadow: 0 12px 30px rgba(0,0,0,.12);
  overflow: hidden;
}
.tabbar button {
  border: 0; background: transparent;
  font-size: 10px; color: #9aa0a6;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  cursor: pointer;
}
.tabbar button.on { color: var(--orange); font-weight: 700; }
.tabbar .ico { font-size: 18px; }

.form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
label { font-size: 12px; color: var(--muted); font-weight: 600; }
input, select, textarea {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 13px 12px;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
}
textarea { min-height: 110px; resize: none; }
.field { display: flex; flex-direction: column; gap: 6px; }

.scan-box {
  background: linear-gradient(160deg, #ff8a3d, #ff5a00);
  color: #fff;
  border-radius: 20px;
  padding: 22px 18px;
  text-align: center;
}
.scan-box h3 { font-size: 22px; margin: 8px 0 6px; }
.scan-preview {
  background: #fff;
  color: #111;
  border-radius: 16px;
  padding: 14px;
  margin-top: 14px;
  text-align: left;
}
.passport-preview {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 14px;
  margin: 12px 0 4px;
  background: #fff;
}
.passport-empty {
  margin: 12px 0 4px;
  border: 1px dashed rgba(255,255,255,.6);
  border-radius: 14px;
  padding: 28px 10px;
  font-size: 13px;
  opacity: .9;
}
.hidden-file { display: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid #eadfd6;
  background: #fff;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
}
.chip.on { background: var(--orange); color: #fff; border-color: var(--orange); }

.expert {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  display: flex;
  gap: 12px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
}
.avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--orange-soft);
  display: grid; place-items: center;
  font-weight: 800; color: var(--orange);
}
.tag {
  display: inline-block;
  background: var(--orange-soft);
  color: var(--orange-dark);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
}
.pill {
  display: inline-block;
  background: #111;
  color: #fff;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
}

.news, .job, .post {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.news small, .job small, .post small { color: var(--muted); }
.job .wage { color: var(--orange); font-weight: 800; margin-top: 6px; }

.banner {
  margin: 0 16px 12px;
  background: linear-gradient(135deg, #ff7a2e, #ff4d00);
  color: #fff;
  border-radius: 18px;
  padding: 18px;
}
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; }
.mt16 { margin-top: 16px; }
.pad { padding: 16px; }

/* Toasts sit at the top, over the header, so they never cover content cards.
   pointer-events: none keeps the header buttons underneath tappable. */
.toast {
  position: absolute;
  left: 20px; right: 20px; top: 40px;
  background: rgba(17,17,17,.94); color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
  z-index: 40;
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
  animation: toast-in .18s ease-out;
  pointer-events: none;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.lang-btns { display: flex; gap: 8px; margin-top: 18px; }
.lang-btns button {
  flex: 1; border: 1px solid rgba(255,255,255,.45);
  background: rgba(255,255,255,.16);
  color: #fff; border-radius: 12px; padding: 10px;
  cursor: pointer; font-weight: 700;
}
.lang-btns button.on { background: #fff; color: #111; }

/* ---- v0.2: passport OCR beta ---- */
.beta {
  display: inline-block;
  vertical-align: middle;
  background: #111; color: #fff;
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 10px; font-weight: 800; letter-spacing: .6px;
}
.btn-sm { padding: 10px 12px; font-size: 14px; }
.btn-sample { background: rgba(255,255,255,.18); color: #fff; border: 1px dashed rgba(255,255,255,.75); }
.btn-sample:disabled, .btn-black:disabled, .btn-white:disabled { cursor: default; }
.privacy {
  margin-top: 10px;
  background: rgba(0,0,0,.16);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 11.5px;
  line-height: 1.45;
  text-align: left;
}
.sample-note { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
.ocr-panel {
  margin-top: 12px;
  background: #fff; color: #111;
  border-radius: 12px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.45;
  text-align: left;
}
.ocr-panel.warn { background: #fff7e6; color: #7a3d00; }
.ocr-step { font-weight: 700; }
.progress { height: 6px; background: #f0e3d9; border-radius: 99px; margin-top: 8px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--orange); transition: width .2s; }
.review-card {
  margin-top: 14px;
  background: #fff;
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
  border: 2px solid var(--orange);
}
.review-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.conf { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; font-weight: 600; }
.conf.high { background: #e9f8ef; color: #146c37; }
.conf.mid { background: #fff5e0; color: #8a5300; }
.conf.low { background: #fdecec; color: #a11d1d; }
.chk-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chk { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 8px; }
.chk.ok { background: #e9f8ef; color: #146c37; }
.chk.bad { background: #fdecec; color: #a11d1d; }
.fstat { font-size: 10.5px; font-weight: 700; margin-left: 4px; border-radius: 6px; padding: 1px 5px; }
.fstat.ok { color: #146c37; background: #e9f8ef; }
.fstat.bad { color: #a11d1d; background: #fdecec; }
.fstat.warn { color: #8a5300; background: #fff5e0; }
.fstat.info { color: var(--muted); background: #f1f2f4; }
input.bad { border-color: #e04848; background: #fff8f8; }
.small { font-size: 11.5px; }
.mrz-raw {
  font-family: "OCR-B", "Courier New", ui-monospace, monospace;
  font-size: 10.5px;
  background: #f6f6f6;
  border-radius: 8px;
  padding: 8px;
  margin-top: 6px;
  overflow-x: auto;
  white-space: pre;
}
summary { cursor: pointer; }

/* ---- language switch (내 정보 + header sheet) ---- */
.lang-seg { display: flex; gap: 8px; }
.lang-seg button {
  flex: 1;
  border: 1px solid #eadfd6;
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 11px 6px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.lang-seg button.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.sheet-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 35;
  display: flex; align-items: flex-end;
}
.sheet {
  width: 100%;
  background: #fff;
  border-radius: 22px 22px 0 0;
  padding: 20px 16px 28px;
}

/* ---- v0.3: 산재 checklist beta ---- */
.beta-light { background: #fff; color: var(--orange-dark); }
.sj-note {
  background: #fff8ec;
  border: 1px solid #ffd9a8;
  color: #7a4a00;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.5;
}
.sj-check {
  display: flex; gap: 10px; align-items: flex-start;
  width: 100%; border: 0; background: transparent;
  text-align: left; cursor: pointer; font-family: inherit;
  padding: 0; color: var(--ink);
}
.sj-box {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 7px;
  border: 2px solid #d6d9de;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 900; color: #fff;
  margin-top: 1px;
}

.sj-step-head { display: flex; gap: 12px; align-items: center; }
.sj-step-head h2 { font-size: 18px; line-height: 1.3; }
.sj-step-ico { width: 48px; height: 48px; border-radius: 14px; background: var(--orange-soft); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
.sj-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sj-nav .btn + .btn { margin-top: 0; }
.tag-sample { background: #f1f2f4; color: #6b7280; }
.tag-official { background: #e9f8ef; color: #146c37; }
.match-group, .match-group-dir { font-size: 14px; margin: 14px 0 8px; }

/* ---------- Stage 4: simple lists + drill-down detail screens ---------- */
.topbar { display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; gap: 4px; padding: 42px 12px 12px; }
.topbar h1 { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; }
.top-l { display: flex; align-items: center; justify-content: flex-start; }
.top-r { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sos-btn {
  border: 0; background: #e11d2e; color: #fff; font-weight: 900; font-size: 12px; letter-spacing: .6px;
  border-radius: 999px; padding: 7px 10px; cursor: pointer; box-shadow: 0 3px 10px rgba(225, 29, 46, .35); font-family: inherit;
}
.row .meta { min-width: 0; }
.row .meta b { line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .meta > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
a.row { text-decoration: none; color: inherit; }
.row .tag { font-size: 10.5px; padding: 2px 7px; vertical-align: middle; }
.row .role { font-style: normal; }
.avatar-s { font-weight: 800; color: var(--orange-dark); font-size: 16px; }
.row.dir-hit .ico { background: #ffe1cc; }
.fav-star { color: #f5a300; }
.row-sos .ico { background: #fde8ea; }
.sub-h { font-size: 14px; margin: 18px 0 8px; }
.link-btn { background: none; border: 0; color: var(--orange-dark); font: inherit; font-size: 13px; font-weight: 700; padding: 4px 2px; cursor: pointer; text-decoration: underline; }
.form-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.form-head .muted { font-size: 12.5px; }

/* home SOS */
.sos-home {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: linear-gradient(135deg, #f0283a, #c8101f); color: #fff; border: 0; border-radius: 18px;
  padding: 14px 16px; text-align: left; cursor: pointer; font-family: inherit; box-shadow: 0 10px 24px rgba(200, 16, 31, .3);
}
.sos-home .sos-ic { background: #fff; color: #d0141f; font-weight: 900; border-radius: 12px; padding: 9px 8px; font-size: 14px; letter-spacing: .8px; }
.sos-home .meta { flex: 1; }
.sos-home .meta b { display: block; font-size: 17px; }
.sos-home .meta span { font-size: 12.5px; opacity: .92; }
.sos-home .chev { color: #fff; font-size: 20px; }

/* 산재 */
.sj-top { padding-bottom: 6px; }
.sj-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }
.sj-prog { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.sj-prog .progress { margin-top: 6px; }
.chk-list { padding: 0; }
.chk-row { display: flex; align-items: stretch; }
.chk-row + .chk-row { border-top: 1px solid var(--line); }
.chk-row .sj-check { width: 52px; flex-shrink: 0; justify-content: center; align-items: center; padding: 0; }
.chk-row .sj-box { margin: 0; }
.chk-row.on .sj-box { background: var(--orange); border-color: var(--orange); }
.chk-open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent;
  padding: 13px 14px 13px 0; text-align: left; cursor: pointer; font-family: inherit; color: var(--ink);
}
.chk-t { flex: 1; font-size: 14px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chk-row.on .chk-t { color: #6b7280; }

/* detail screens */
.d-kicker { margin-bottom: 6px; }
.d-title { font-size: 19px; line-height: 1.38; }
.d-body { font-size: 14px; line-height: 1.6; color: #374151; }
.d-body p + p { margin-top: 10px; }
.d-src { font-size: 12px; color: var(--muted); display: grid; gap: 6px; background: #fff; border-radius: 14px; padding: 12px 14px; }
.d-src b { color: var(--ink); font-size: 12.5px; }
.d-src a { color: #b45309; word-break: break-all; }
.d-head { display: flex; gap: 12px; align-items: center; }
.d-ico { width: 52px; height: 52px; border-radius: 16px; background: var(--orange-soft); display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }
.avatar-l { font-size: 22px; font-weight: 800; color: var(--orange-dark); }
.d-calls { display: grid; gap: 8px; }
.d-call {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
  background: var(--orange); color: #fff; border: 0; border-radius: 16px; padding: 14px 16px; text-decoration: none; font-family: inherit; cursor: pointer; text-align: left;
}
.d-call .d-num { font-size: 19px; font-weight: 900; letter-spacing: .3px; }
.d-call .d-lab { font-size: 12px; opacity: .92; }
.d-call-sample { background: #e5e7eb; color: #374151; }
.dir-star.on { color: #b77900; border-color: #f5d27a; background: #fffaf0; }
.d-info { padding: 2px 0; }
.d-row { display: flex; gap: 12px; padding: 11px 14px; font-size: 13.5px; line-height: 1.5; }
.d-row + .d-row { border-top: 1px solid var(--line); }
.d-k { width: 72px; flex-shrink: 0; color: var(--muted); font-weight: 700; font-size: 12.5px; }
.d-v { flex: 1; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
.d-v a { color: var(--orange-dark); }
.dir-checked { white-space: nowrap; font-weight: 600; }

/* directory */
.dir-top { padding-bottom: 6px; }
.dir-note { margin: 6px 0 10px; }
.dir-search { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); font: inherit; font-size: 15px; background: #fff; }
.dir-search:focus, .dir-area input:focus, .dir-sel select:focus { outline: none; border-color: var(--orange); }
.dir-n { font-size: 12px; color: var(--muted); font-weight: 600; }
.dir-empty { background: #fff; border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }
.dir-area { display: flex; gap: 8px; }
.dir-area input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); font: inherit; }

      { id: "ev-witness", ko: "목격자 이름·연락처와 들은 내용 메모하기", en: "Write down witnesses' names, contacts and what they saw",

      { id: "ev-chat", ko: "사업주·관리자와 주고받은 문자·메신저 저장하기", en: "Save texts/chats with your employer or manager",
        dko: "사고를 알린 사실이나 사업주의 답변을 보여 주는 기록이 됩니다.", den: "Shows that you reported the accident and how the employer responded.", src: ["comwelProcess"] },
      { id: "ev-medical", ko: "진단서·진료비 영수증 보관하기", en: "Keep medical certificates and treatment receipts",

    ] },
  { id: "apply", icon: "📝",
    title: { ko: "요양급여 신청 (근로복지공단)", en: "Apply for medical benefits (COMWEL)", si: "වෛද්‍ය ප්‍රතිලාභ සඳහා අයදුම් කරන්න (COMWEL)" },
    items: [
      { id: "ap-who", ko: "다친 근로자 본인이 근로복지공단에 직접 신청할 수 있음", en: "The injured worker can apply to COMWEL directly",
        dko: "요양급여를 받으려는 사람이 소속 사업장, 재해발생 경위, 의학적 소견 등을 적은 서류를 첨부해 공단에 신청합니다.", den: "The person seeking medical benefits applies to COMWEL with documents stating the workplace, how the accident happened and the medical opinion.", src: ["iaci41"] },
      { id: "ap-hospital", ko: "병원(산재보험 의료기관)이 대신 신청해 줄 수 있음", en: "The hospital (WCI medical institution) can file it for you",
        dko: "진료한 산재보험 의료기관이 업무상 재해로 판단하면 근로자 동의를 받아 신청을 대행할 수 있습니다. 신청서의 제출 위임란에 서명·날인하면 병원이 토탈서비스로 접수할 수 있어요.", den: "If the treating WCI hospital judges it a work injury, it can file on your behalf with your consent; sign the delegation box on the form and the hospital submits it online.", src: ["iaci41", "iaciRule20", "comwelApply"] },

      { id: "ap-form", ko: "요양급여신청서 작성: 인적사항·소속 사업장·재해 경위 + 의사 소견", en: "Fill in the application: personal details, workplace, how it happened + doctor's opinion",
        dko: "사업장관리번호는 공단 홈페이지에서 사업장명으로 검색할 수 있습니다. 온라인(고용·산재보험 토탈서비스)으로도 상담·신청할 수 있어요.", den: "The workplace management number can be searched on the COMWEL website. You can also get advice and apply online via the Total Service.", src: ["comwelApply", "comwelTotal"] },
      { id: "ap-result", ko: "결과 통지 확인 (원칙 7일, 조사가 필요하면 더 걸림)", en: "Check the decision (usually 7 days; longer if investigation is needed)",
        dko: "업무상 재해 여부가 명확하면 7일 이내에 승인 여부를 통지합니다. 사실관계 확인이나 업무상 질병 조사가 필요하면 더 걸릴 수 있습니다. 토탈서비스 '나의 사건 검색'으로 진행 상황을 볼 수 있어요.", den: "If it's clearly work-related, COMWEL notifies within 7 days; fact-finding or occupational-disease investigations take longer. Track it under 'My case' on the Total Service.", src: ["comwelApply", "comwelTotal"] },
    ] },
  { id: "benefits", icon: "💰",
    title: { ko: "휴업급여와 다른 보험급여", en: "Temporary disability and other benefits", si: "තාවකාලික ආබාධ සහ වෙනත් ප්‍රතිලාභ" },
    items: [
      { id: "be-hyueop", ko: "휴업급여: 치료 때문에 일하지 못한 기간, 1일 평균임금의 70%", en: "Temporary disability benefit: 70% of average daily wage for days you couldn't work",
        dko: "요양으로 취업하지 못한 기간에 지급하며, 취업하지 못한 기간이 3일 이내이면 지급하지 않습니다.", den: "Paid for the period you can't work due to treatment; not paid if that period is 3 days or less.", src: ["iaci52"] },

      { id: "be-others", ko: "그 밖의 급여: 간병·유족·상병보상연금·장례비·직업재활급여", en: "Other benefits: nursing care, survivors', injury-disease pension, funeral, vocational rehabilitation",
        dko: "산재보험 급여는 요양, 휴업, 장해, 간병, 유족, 상병보상연금, 장례비, 직업재활급여 8가지입니다.", den: "There are 8 types: medical care, temporary disability, disability, nursing care, survivors', injury-disease compensation pension, funeral expenses, vocational rehabilitation.", src: ["iaci36"] },
    ] },
  { id: "refuse", icon: "🛑",
    title: { ko: "사업주가 거부하거나 숨길 때", en: "If the employer refuses or hides it", si: "සේවා යෝජකයා ප්‍රතික්ෂේප කරයි නම් හෝ සඟවයි නම්" },
    items: [
      { id: "re-self", ko: "사업주가 반대해도 내가 직접 신청할 수 있음", en: "You can apply yourself even if the employer objects",
        dko: "신청 요건에 사업주 확인은 없습니다(2018년 폐지). 공단은 사업주 의견을 듣지만 신청은 근로자가 합니다.", den: "Employer confirmation is not a requirement (abolished 2018). COMWEL hears the employer's opinion, but the worker files.", src: ["iaci41", "molegNoSeal", "iaciRule20"] },
      { id: "re-hide", ko: "산재 은폐는 불법: 1년 이하 징역 또는 1천만원 이하 벌금", en: "Hiding an accident is illegal: up to 1 year in prison or a 10 million won fine",
        dko: "사업주는 산재 발생 사실을 은폐해서는 안 되며, 은폐하거나 은폐를 교사·공모한 자는 처벌됩니다.", den: "Employers must not conceal industrial accidents; concealing, or inciting/conspiring to conceal, is punishable.", src: ["osh57", "osh170"] },
      { id: "re-report", ko: "사업주는 3일 이상 휴업 산재를 1개월 안에 노동관서에 보고해야 함", en: "Employers must report injuries needing 3+ days off to the labour office within 1 month",
        dko: "사망 또는 3일 이상 휴업이 필요한 부상·질병이 생기면 재해 발생일부터 1개월 이내에 산업재해조사표를 제출해야 합니다.", den: "For a death or an injury/illness needing 3+ days off, the employer must submit an industrial accident investigation report within 1 month.", src: ["oshRule73"] },
      { id: "re-dismiss", ko: "산재 신청을 이유로 한 해고·불이익은 금지", en: "Dismissal or disadvantage for claiming is prohibited",

      { id: "re-proof", ko: "사업주는 필요한 증명에 협조해야 함 (연락이 끊기면 생략 가능)", en: "The employer must provide necessary certificates (can be skipped if they disappear)",
        dko: "보험급여에 필요한 증명을 요구하면 사업주는 해 주어야 하고, 사업주가 행방불명 등으로 불가능하면 생략할 수 있습니다.", den: "The employer must provide certificates needed for benefits; if impossible (e.g. the employer has disappeared) they may be omitted.", src: ["iaci116"] },
      { id: "re-uninsured", ko: "회사가 산재보험 신고를 안 했어도 신청할 수 있음 (당연가입 사업장)", en: "You can still apply if the employer never registered for WCI (mandatory workplaces)",
        dko: "산재보험 당연가입 사업은 사업이 시작된 날 보험관계가 성립합니다. 신고를 게을리한 기간에 난 재해도 공단이 급여를 지급하고 사업주에게서 징수할 수 있습니다. 미가입 신고센터도 있어요.", den: "For mandatory workplaces, coverage starts the day the business starts. For accidents while the employer failed to register, COMWEL pays and can recover the cost from the employer. There is also a reporting centre for unregistered workers.", src: ["premium7", "premium26", "comwelUnreg"] },
      { id: "re-call", ko: "상담·신고: 고용노동부 1350, 근로복지공단 1588-0075", en: "Advice/report: Ministry of Employment and Labor 1350, COMWEL 1588-0075",
        dko: "아래 '공식 연락처'에서 바로 전화할 수 있어요.", den: "Call directly from 'Official contacts' below.", src: ["moelMain", "comwelMain"] },
    ] },
  { id: "foreign", icon: "🌏",
    title: { ko: "외국인 근로자도 보호받아요", en: "Foreign workers are covered too", si: "විදේශීය සේවකයින්ටද ආරක්ෂාව ඇත" },
    items: [
      { id: "fo-all", ko: "국적·체류자격과 관계없이 보호 (미등록 체류자 포함)", en: "Covered regardless of nationality or visa status (including undocumented)",
        dko: "고용노동부: 산재보험은 국적·체류신분에 따른 차별이 없고, 외국인 근로자는 합법·불법을 구분하지 않고 업무상 재해 치료와 산재보상을 받을 수 있습니다.", den: "MOEL: WCI does not discriminate by nationality or residence status; foreign workers, documented or not, can receive treatment and compensation for work injuries.", src: ["moelForeign"] },
      { id: "fo-data", ko: "알아둘 점: 공단은 출입국 기관이 요청하면 자료를 제출할 수 있음", en: "Note: COMWEL may share data if immigration authorities request it",
        dko: "고용노동부 설명에 따르면 공단은 출입국관리법에 따른 관계기관의 자료 제출 요구가 있으면 자료를 제출합니다. 걱정되면 신청 전에 노무사나 상담센터와 먼저 상의하세요.", den: "According to MOEL, COMWEL submits data when requested by authorities under the Immigration Act. If worried, talk to a labour attorney or counselling centre before applying.", src: ["moelForeign"] },
      { id: "fo-season", ko: "계절근로자(농업): 내 농가가 산재보험인지 농업인안전보험인지 확인하기", en: "Seasonal (farm) workers: check whether your farm has WCI or Farmers' Safety Insurance",
        dko: "법인이 아닌 상시 5명 미만 농가는 산재보험 당연적용에서 제외됩니다. 이런 농가는 산재보험이나 농업인안전보험(산재형)에 가입해야 계절근로자를 고용할 수 있습니다. 농업인안전보험은 NH농협생명이 운영하고 지역 농협에서 가입하니, 보상 청구는 가입한 농협에 문의하세요.", den: "Non-corporate farms with fewer than 5 regular workers are excluded from mandatory WCI. Such farms must have WCI or Farmers' Safety Insurance (WCI type) to hire seasonal workers. That insurance is run by NH NongHyup Life via local NongHyup branches, so ask that branch how to claim.", src: ["iaciDec2", "mafra2023"] },
      { id: "fo-season26", ko: "2026.2.15 이후 계약한 계절근로자: 3대 의무보험 확인하기", en: "Seasonal contracts from 15 Feb 2026: check the 3 mandatory insurances",
        dko: "고용주는 임금체불보증보험과 농업인안전보험, 계절근로자 본인은 상해보험(입국일부터 15일 이내)에 가입해야 합니다. 계도기간은 2027.2.14까지입니다.", den: "The employer must buy wage-arrears guarantee insurance and Farmers' Safety Insurance; the worker must buy accident insurance (within 15 days of entry). Grace period until 14 Feb 2027.", src: ["mafra2026"] },
      { id: "fo-eps", ko: "고용허가제(E-9): 산재 상황에 따라 사업주 동의 없이 사업장 변경 가능", en: "EPS (E-9): depending on the case, you may change workplace without employer consent",
        dko: "고용노동부(2022) 설명에 따르면 산업안전보건법 위반으로 부상·질병이 생긴 경우 등 근로자 책임이 없는 사유에는 사업주 동의 없이 사업장을 바꿀 수 있습니다(변경 횟수 미차감).", den: "According to MOEL (2022), in cases not the worker's fault, e.g. injury caused by a safety-law violation, you can change workplace without employer consent (not counted toward the limit).", src: ["moelForeign"] },
      { id: "fo-lang", ko: "모국어 상담: 외국인력상담센터 1577-0071 (싱할라어 8번), 외국인종합안내센터 1345", en: "Native-language help: Foreign Workers Counseling Center 1577-0071 (Sinhala: 8), Immigration Contact Center 1345",
        dko: "외국인력상담센터는 18개 언어(스리랑카 포함)로 상담합니다.", den: "The Foreign Workers Counseling Center offers 18 languages including Sinhala.", src: ["hrdkCenter", "hugkorea", "hikorea"] },
    ] },

      { id: "dl-3y", ko: "보험급여 청구는 3년 안에 (장해·유족급여, 장례비는 5년)", en: "Claim benefits within 3 years (5 years for disability, survivors' benefits and funeral expenses)",

// Employer / worker roles. Pure logic + a storage adapter so a server can replace localStorage later:
// the app only talks to `Repo` (createRepo(store)). A server adapter needs the same methods.
const ROLE_KEYS = { role: "mpg_role", biz: "mpg_biz", workers: "mpg_biz_workers", employer: "mpg_employer", empSkip: "mpg_employer_skip" };

// 사업자등록번호 10 digits: weights 1,3,7,1,3,7,1,3,5 + floor(d9*5/10); check digit = (10 - sum % 10) % 10.
function bizNoDigits(s) { return String(s || "").replace(/\D/g, ""); }
function bizNoValid(s) {
  const d = bizNoDigits(s);
  if (d.length !== 10) return false;
  const w = [1, 3, 7, 1, 3, 7, 1, 3, 5];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += Number(d[i]) * w[i];
  sum += Math.floor((Number(d[8]) * 5) / 10);
  return (10 - (sum % 10)) % 10 === Number(d[9]);
}
function bizNoFormat(s) {
  const d = bizNoDigits(s);
  return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}` : String(s || "").trim();
}

// Best-effort reader for OCR text of a 사업자등록증. Never returns a 주민등록번호 (13-digit numbers are dropped).
function parseBizCert(text) {
  const out = { bizNo: "", name: "", ceo: "", address: "", bizType: "", bizItem: "" };
  const lines = String(text || "").split(/\r?\n/).map((l) => l.replace(/[|｜]/g, " ").trim()).filter(Boolean);
  const squash = (s) => s.replace(/\s+/g, "");
  const after = (line, label) => {
    // value = text after the label (spaces inside the label tolerated) and an optional ':'
    const re = new RegExp(label.split("").join("\\s*") + "\\s*[:：;.]?\\s*(.*)$");
    const m = line.match(re);
    return m ? m[1].replace(/^[:：;.\s]+/, "").trim() : "";
  };
  // 등록번호: 3-2-5 digits; also tolerate OCR spaces; ignore 13-digit (주민등록번호-like) runs.
  for (const l of lines) {
    if (/\d{6}\s*-\s*\d{7}/.test(l)) continue;
    const m = l.replace(/[Oo]/g, "0").match(/(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})/);
    if (m) { out.bizNo = `${m[1]}-${m[2]}-${m[3]}`; break; }
  }
  for (const l of lines) {
    const s = squash(l);
    if (!out.name && /^(상호|법인명|상호\(법인명\))/.test(s)) out.name = after(l, "상호").replace(/^\(?법인명\)?\s*[:：]?\s*/, "") || after(l, "법인명");
    else if (!out.ceo && /^(대표자|성명)/.test(s)) out.ceo = after(l, s.startsWith("대표자") ? "대표자" : "성명");
    else if (!out.address && /^사업장(소재지)?/.test(s)) out.address = after(l, s.startsWith("사업장소재지") ? "사업장소재지" : "사업장");
    else if (!out.bizType && /^업태/.test(s)) { out.bizType = after(l, "업태"); const k = out.bizType.match(/^(.*?)\s*종목\s*[:：]?\s*(.*)$/); if (k) { out.bizType = k[1].trim(); out.bizItem = k[2].trim(); } }
    else if (!out.bizItem && /^종목/.test(s)) out.bizItem = after(l, "종목");
  }
  for (const k of Object.keys(out)) out[k] = out[k].replace(/\s{2,}/g, " ").replace(/\d{6}\s*-\s*\d{7}/g, "").trim();
  return out;
}

// 사업장 코드: short, readable, derived from the 등록번호 + a random part (letters without I/O, digits without 0/1).
function makeBizCode(bizNo, rnd = Math.random) {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let h = 0;
  for (const c of bizNoDigits(bizNo)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  let s = "";
  for (let i = 0; i < 3; i++) { s += A[h % A.length]; h = Math.floor(h / A.length); }
  for (let i = 0; i < 3; i++) s += A[Math.floor(rnd() * A.length)];
  return `MP-${s}`;
}
const normCode = (c) => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^MP/, "");

function createRepo(store) {
  const getJ = (k, fb) => { try { const v = JSON.parse(store.get(k)); return v == null ? fb : v; } catch (e) { return fb; } };
  const setJ = (k, v) => store.set(k, JSON.stringify(v));
  return {
    kind: "local",
    getRole: () => { const r = store.get(ROLE_KEYS.role); return r === "employer" || r === "worker" ? r : null; },
    setRole: (r) => store.set(ROLE_KEYS.role, r),
    getBusiness: () => getJ(ROLE_KEYS.biz, null),
    saveBusiness: (b) => { const cur = getJ(ROLE_KEYS.biz, null); const biz = { ...b, bizNo: bizNoFormat(b.bizNo), code: (cur && cur.code) || b.code || makeBizCode(b.bizNo), updatedAt: Date.now() }; setJ(ROLE_KEYS.biz, biz); return biz; },
    clearBusiness: () => { store.del(ROLE_KEYS.biz); store.del(ROLE_KEYS.workers); },
    // On a server this is a lookup across employers; locally only this device's business can match.
    findBusinessByCode: (code) => { const b = getJ(ROLE_KEYS.biz, null); return b && normCode(b.code) === normCode(code) && normCode(code) ? b : null; },
    listWorkers: () => getJ(ROLE_KEYS.workers, []),
    addWorker: (w) => { const l = getJ(ROLE_KEYS.workers, []); const i = l.findIndex((x) => x.id === w.id); if (i >= 0) l[i] = { ...l[i], ...w }; else l.push(w); setJ(ROLE_KEYS.workers, l); return l; },
    removeWorker: (id) => { const l = getJ(ROLE_KEYS.workers, []).filter((x) => x.id !== id); setJ(ROLE_KEYS.workers, l); return l; },
    getEmployer: () => getJ(ROLE_KEYS.employer, null),
    saveEmployer: (e) => { const v = { ...e, bizNo: e.bizNo ? bizNoFormat(e.bizNo) : "" }; setJ(ROLE_KEYS.employer, v); store.del(ROLE_KEYS.empSkip); return v; },
    skipEmployer: () => store.set(ROLE_KEYS.empSkip, "1"),
    employerSkipped: () => store.get(ROLE_KEYS.empSkip) === "1",
  };
}
function memoryStore() { const m = new Map(); return { get: (k) => (m.has(k) ? m.get(k) : null), set: (k, v) => { m.set(k, String(v)); }, del: (k) => { m.delete(k); } }; }

// ==== MRZ PARSER START ====
// ICAO 9303 TD3 (passport) MRZ parsing with check-digit validation.
// Pure functions, no DOM: unit-tested in node (see tests/mrz.test.js).
const MRZ = (() => {
  const LEN = 44;
  const WEIGHTS = [7, 3, 1];
  const charValue = (ch) => {
    if (ch >= "0" && ch <= "9") return ch.charCodeAt(0) - 48;
    if (ch >= "A" && ch <= "Z") return ch.charCodeAt(0) - 55;
    return 0; // "<" filler
  };
  function checkDigit(str) {
    let sum = 0;
    for (let i = 0; i < str.length; i++) sum += charValue(str[i]) * WEIGHTS[i % 3];
    return String(sum % 10);
  }
  // Typical OCR confusions, by expected character class.
  const TO_DIGIT = { O: "0", Q: "0", D: "0", U: "0", I: "1", L: "1", T: "7", Z: "2", S: "5", B: "8", G: "6", A: "4" };
  const TO_ALPHA = { "0": "O", "1": "I", "2": "Z", "4": "A", "5": "S", "6": "G", "8": "B" };
  const SWAP = { "0": "O", O: "0", "1": "I", I: "1", "2": "Z", Z: "2", "5": "S", S: "5", "8": "B", B: "8", "6": "G", G: "6" };

  const COUNTRIES = {
    LKA: ["Sri Lanka", "스리랑카"], KOR: ["Republic of Korea", "대한민국"], NPL: ["Nepal", "네팔"],
    VNM: ["Viet Nam", "베트남"], PHL: ["Philippines", "필리핀"], IDN: ["Indonesia", "인도네시아"],
    THA: ["Thailand", "태국"], KHM: ["Cambodia", "캄보디아"], MMR: ["Myanmar", "미얀마"],
    UZB: ["Uzbekistan", "우즈베키스탄"], MNG: ["Mongolia", "몽골"], BGD: ["Bangladesh", "방글라데시"],
    PAK: ["Pakistan", "파키스탄"], KGZ: ["Kyrgyzstan", "키르기스스탄"], TLS: ["Timor-Leste", "동티모르"],
    LAO: ["Lao PDR", "라오스"], CHN: ["China", "중국"], IND: ["India", "인도"], JPN: ["Japan", "일본"],
    USA: ["United States", "미국"], GBR: ["United Kingdom", "영국"], "D<<": ["Germany", "독일"],
    UTO: ["Utopia (ICAO specimen)", "유토피아(ICAO 견본)"],
  };
  function countryName(code, lang) {
    const c = COUNTRIES[code] || COUNTRIES[(code || "").replace(/<+$/, "").padEnd(3, "<")];
    if (!c) return (code || "").replace(/</g, "");
    return lang === "ko" ? c[1] : c[0];
  }

  function clean(line) {
    return String(line || "")
      .toUpperCase()
      .replace(/[«‹＜〈]/g, "<")
      .replace(/\s+/g, "")
      .replace(/[^A-Z0-9<]/g, "");
  }

  // Map a char to the expected class, recording corrections.
  function fixClass(str, cls, field, corrections) {
    let out = "";
    for (const ch of str) {
      let n = ch;
      if (cls === "digit" && !/[0-9]/.test(ch) && TO_DIGIT[ch]) n = TO_DIGIT[ch];
      if (cls === "alpha" && /[0-9]/.test(ch) && TO_ALPHA[ch]) n = TO_ALPHA[ch];
      if (n !== ch) corrections.push({ field, from: ch, to: n });
      out += n;
    }
    return out;
  }

  // If a check digit fails, list variants with ambiguous chars swapped (O/0, I/1, S/5, ...)
  // that satisfy it, fewest swaps first. The caller only accepts one if the composite
  // check digit agrees too, so a misread check digit can't "fix" correct data.
  function swapCandidates(value, cd) {
    if (checkDigit(value) === cd) return [value];
    const idx = [];
    for (let i = 0; i < value.length; i++) if (SWAP[value[i]]) idx.push(i);
    if (!idx.length || idx.length > 8) return [];
    const found = [];
    for (let mask = 1; mask < 1 << idx.length; mask++) {
      const arr = value.split("");
      idx.forEach((pos, b) => { if (mask & (1 << b)) arr[pos] = SWAP[arr[pos]]; });
      const cand = arr.join("");
      if (checkDigit(cand) === cd) found.push(cand);
    }
    const diff = (c) => c.split("").filter((ch, i) => ch !== value[i]).length;
    return found.sort((a, b) => diff(a) - diff(b)).slice(0, 6);
  }
  function noteSwaps(from, to, field, corrections) {
    for (let i = 0; i < from.length; i++) if (from[i] !== to[i]) corrections.push({ field, from: from[i], to: to[i] });
  }

  function yymmddToISO(s, kind, now) {
    if (!/^\d{6}$/.test(s)) return null;
    const yy = +s.slice(0, 2), mm = +s.slice(2, 4), dd = +s.slice(4, 6);
    const curYY = (now || new Date()).getFullYear() % 100;
    let year;
    if (kind === "birth") year = yy > curYY ? 1900 + yy : 2000 + yy;
    else year = yy > curYY + 50 ? 1900 + yy : 2000 + yy;
    const d = new Date(Date.UTC(year, mm - 1, dd));
    if (d.getUTCFullYear() !== year || d.getUTCMonth() !== mm - 1 || d.getUTCDate() !== dd) return null;
    return `${year}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  }

  function normalizeLine1(raw) {
    let l = clean(raw);
    const p = l.indexOf("P");
    if (p > 0 && p <= 2 && l[p + 1] !== undefined) l = l.slice(p);
    // Only passports (TD3) are supported: a misread "P" (5, F, B, 8, R) becomes P.
    else if (p !== 0 && /^[5FB8R][A-Z0-9<][A-Z<]{3}/.test(l)) l = "P" + l.slice(1);
    let head = l.slice(0, 5);
    let names = l.slice(5);
    // Names never contain "<<<": everything from the first "<<<" on is filler.
    names = names.replace(/<[KLCE](?=<<)/g, "<<");
    const fill = names.indexOf("<<<");
    if (fill >= 0) names = names.slice(0, fill);
    names = names.replace(/[0-9]/g, (d) => TO_ALPHA[d] || d);
    return (head + names).padEnd(LEN, "<").slice(0, LEN);
  }

  function parseLine2(l2, now) {
    const corrections = [];
    const num0 = l2.slice(0, 9);
    const numCd = fixClass(l2[9], "digit", "passportNumber", corrections);
    const nat = fixClass(l2.slice(10, 13), "alpha", "nationality", corrections);
    const birth = fixClass(l2.slice(13, 19), "digit", "birthDate", corrections);
    const birthCd = fixClass(l2[19], "digit", "birthDate", corrections);
    let sex = l2[20];
    const exp = fixClass(l2.slice(21, 27), "digit", "expiryDate", corrections);
    const expCd = fixClass(l2[27], "digit", "expiryDate", corrections);
    const pers0 = l2.slice(28, 42);
    const persCd = l2[42] === "<" ? "<" : fixClass(l2[42], "digit", "personalNumber", corrections);
    const compCd = fixClass(l2[43], "digit", "composite", corrections);

    const persAllFiller = /^<+$/.test(pers0);
    if (sex === "H" || sex === "N") { corrections.push({ field: "sex", from: sex, to: "M" }); sex = "M"; }
    if (sex === "E" || sex === "P") { corrections.push({ field: "sex", from: sex, to: "F" }); sex = "F"; }
    const build = (n, p) => n + numCd + nat + birth + birthCd + sex + exp + expCd + p + persCd + compCd;
    const compOk = (l) => checkDigit(l.slice(0, 10) + l.slice(13, 20) + l.slice(21, 43)) === compCd;
    let num = num0, pers = pers0;
    const numC = swapCandidates(num0, numCd);
    const persC = persAllFiller ? [pers0] : swapCandidates(pers0, persCd);
    if (numC[0] !== num0 || persC[0] !== pers0) {
      outer: for (const n of numC.length ? numC : [num0]) {
        for (const p of persC.length ? persC : [pers0]) {
          if (compOk(build(n, p))) { num = n; pers = p; break outer; }
        }
      }
      noteSwaps(num0, num, "passportNumber", corrections);
      noteSwaps(pers0, pers, "personalNumber", corrections);
    }

    const line = build(num, pers);
    const checks = {
      passportNumber: checkDigit(num) === numCd,
      birthDate: checkDigit(birth) === birthCd,
      expiryDate: checkDigit(exp) === expCd,
      personalNumber: persAllFiller ? (persCd === "<" || persCd === "0") : checkDigit(pers) === persCd,
      composite: checkDigit(line.slice(0, 10) + line.slice(13, 20) + line.slice(21, 43)) === compCd,
    };
    return {
      line, checks, corrections,
      raw: { num, nat, birth, sex, exp, pers },
      birthDate: yymmddToISO(birth, "birth", now),
      expiryDate: yymmddToISO(exp, "expiry", now),
    };
  }

  const score = (p) => Object.values(p.checks).filter(Boolean).length;

  // Fix line length: OCR may drop or insert characters.
  function normalizeLine2(raw, now) {
    let l = clean(raw);
    if (l.length === LEN) return parseLine2(l, now);
    const cands = [];
    if (l.length > LEN && l.length <= LEN + 2) {
      const extra = l.length - LEN;
      for (let i = 0; i < l.length; i++) {
        const a = l.slice(0, i) + l.slice(i + 1);
        if (extra === 1) cands.push(a);
        else for (let j = i; j < a.length; j++) cands.push(a.slice(0, j) + a.slice(j + 1));
      }
    } else if (l.length < LEN && l.length >= LEN - 2) {
      const miss = LEN - l.length;
      for (let i = 0; i <= l.length; i++) {
        const a = l.slice(0, i) + "<" + l.slice(i);
        if (miss === 1) cands.push(a);
        else for (let j = i; j <= a.length; j++) cands.push(a.slice(0, j) + "<" + a.slice(j));
      }
    } else {
      cands.push(l.padEnd(LEN, "<").slice(0, LEN));
    }
    let best = null;
    for (const c of new Set(cands)) {
      const p = parseLine2(c, now);
      const s = score(p) * 100 - p.corrections.length;
      if (!best || s > best.s) best = { p, s };
    }
    best.p.corrections.push({ field: "line2", from: `len ${l.length}`, to: `len ${LEN}` });
    return best.p;
  }

  function parse(line1, line2, opts = {}) {
    const now = opts.now || new Date();
    const l1 = normalizeLine1(line1);
    const p2 = normalizeLine2(line2, now);
    const issuing = l1.slice(2, 5);
    const nameField = l1.slice(5);
    const sep = nameField.indexOf("<<");
    const surname = (sep >= 0 ? nameField.slice(0, sep) : nameField).replace(/<+/g, " ").trim();
    const givenNames = (sep >= 0 ? nameField.slice(sep + 2) : "").replace(/<+/g, " ").trim();
    const checks = p2.checks;
    const total = Object.keys(checks).length;
    const ok = Object.values(checks).filter(Boolean).length;
    const warnings = [];
    if (!p2.birthDate) warnings.push("invalidBirthDate");
    if (!p2.expiryDate) warnings.push("invalidExpiryDate");
    if (p2.expiryDate) {
      const today = now.toISOString().slice(0, 10);
      const soon = new Date(now.getTime()); soon.setMonth(soon.getMonth() + 6);
      if (p2.expiryDate < today) warnings.push("expired");
      else if (p2.expiryDate < soon.toISOString().slice(0, 10)) warnings.push("expiringSoon");
    }
    return {
      format: "TD3",
      lines: [l1, p2.line],
      fields: {
        documentType: l1[0],
        issuingCountry: issuing.replace(/<+$/, ""),
        surname,
        givenNames,
        passportNumber: p2.raw.num.replace(/</g, ""),
        nationality: p2.raw.nat.replace(/<+$/, ""),
        birthDate: p2.birthDate,
        sex: ["M", "F"].includes(p2.raw.sex) ? p2.raw.sex : "X",
        expiryDate: p2.expiryDate,
        personalNumber: p2.raw.pers.replace(/</g, ""),
      },
      checks,
      checksPassed: ok,
      checksTotal: total,
      valid: ok === total && l1[0] === "P",
      corrections: p2.corrections,
      warnings,
    };
  }

  // Find the TD3 MRZ in free OCR text and parse it. Returns null if not found.
  function fromText(text, opts = {}) {
    const lines = String(text || "").split(/\r?\n/).map(clean).filter((l) => l.length >= 28);
    const looksL1 = (l) => /^.{0,2}[P5FB8R][A-Z0-9<][A-Z<]{3}/.test(l) && l.includes("<<");
    const digits = (l) => (l.match(/[0-9]/g) || []).length;
    let best = null;
    for (let i = 0; i < lines.length; i++) {
      const a = lines[i];
      // Both lines merged into one.
      if (looksL1(a) && a.length >= 80) {
        const r = parse(a.slice(0, LEN), a.slice(LEN), opts);
        if (!best || r.checksPassed > best.checksPassed) best = r;
        continue;
      }
      const b = lines[i + 1];
      if (!b) continue;
      if (looksL1(a) && digits(b) >= 10) {
        const r = parse(a, b, opts);
        if (!best || r.checksPassed > best.checksPassed) best = r;
      }
    }
    return best;
  }

  return { checkDigit, clean, parse, fromText, yymmddToISO, countryName, normalizeLine1 };
})();
// ==== MRZ PARSER END ====

// ==== OCR ENGINE (browser) ====
// Tesseract.js is lazy-loaded from a CDN only when the user starts a scan.
// The image itself never leaves the device: recognition runs in a Web Worker in this browser.
const OCR = (() => {
  const LIB_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
  // OCR-B (MRZ font) fine-tuned model, ~1.4 MB. Falls back to the stock English model.
  const MRZ_LANG = "ocrb_int";
  const MRZ_LANG_PATH = "https://cdn.jsdelivr.net/gh/Shreeshrii/tessdata_ocrb@f59241ad46a38810fa31acaa76e8522718c7b6a3";
  const WHITELIST = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<";
  let libPromise = null;
  let worker = null;
  let engine = null;
  let progressCb = () => {};

  function withTimeout(promise, ms, code) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Object.assign(new Error(code), { code })), ms);
      promise.then((v) => { clearTimeout(timer); resolve(v); }, (e) => { clearTimeout(timer); reject(e); });
    });
  }

  function loadLib() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      return Promise.reject(Object.assign(new Error("offline"), { code: "OFFLINE" }));
    }
    if (!libPromise) {
      libPromise = withTimeout(new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = LIB_URL;
        s.async = true;
        s.crossOrigin = "anonymous";
        s.onload = () => (window.Tesseract ? resolve(window.Tesseract) : reject(Object.assign(new Error("no global"), { code: "OFFLINE" })));
        s.onerror = () => { s.remove(); reject(Object.assign(new Error("script load failed"), { code: "OFFLINE" })); };
        document.head.appendChild(s);
      }), 20000, "OFFLINE").catch((e) => { libPromise = null; e.code = "OFFLINE"; throw e; });
    }
    return libPromise;
  }

  const logger = (m) => progressCb(m);

  async function getWorker() {
    if (worker) return worker;
    const T = await loadLib();
    try {
      worker = await withTimeout(T.createWorker(MRZ_LANG, 1, { langPath: MRZ_LANG_PATH, gzip: false, logger }), 60000, "OFFLINE");
      engine = "ocrb";
    } catch (e) {
      console.warn("[OCR] MRZ model failed, falling back to eng", e);
      try {
        worker = await withTimeout(T.createWorker("eng", 1, { logger }), 60000, "OFFLINE");
        engine = "eng";
      } catch (e2) {
        worker = null;
        throw Object.assign(new Error("engine load failed"), { code: "OFFLINE" });
      }
    }
    await worker.setParameters({ tessedit_char_whitelist: WHITELIST, tessedit_pageseg_mode: "6" });
    return worker;
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(Object.assign(new Error("image"), { code: "IMAGE" }));
      img.src = src;
    });
  }

  // Crop the bottom part (where the MRZ is), optionally rotate, scale and boost contrast.
  function prepare(img, { bottom = 1, rotate = 0 }) {
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const src = document.createElement("canvas");
    const rw = rotate % 180 ? h : w, rh = rotate % 180 ? w : h;
    src.width = rw; src.height = rh;
    const sctx = src.getContext("2d");
    sctx.translate(rw / 2, rh / 2);
    sctx.rotate((rotate * Math.PI) / 180);
    sctx.drawImage(img, -w / 2, -h / 2);
    const cropH = Math.round(rh * bottom);
    const scale = Math.min(1800 / rw, Math.max(1, 1000 / rw));
    const c = document.createElement("canvas");
    c.width = Math.round(rw * scale);
    c.height = Math.round(cropH * scale);
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, rh - cropH, rw, cropH, 0, 0, c.width, c.height);
    // grayscale + contrast stretch (2nd..98th percentile)
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data, hist = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) {
      const g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0;
      d[i] = g; hist[g]++;
    }
    const n = d.length / 4;
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > n * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * 0.02) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0; i < d.length; i += 4) {
      const g = Math.max(0, Math.min(255, ((d[i] - lo) * 255) / span));
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    ctx.putImageData(id, 0, 0);
    return c;
  }

  // Average confidence of the OCR lines that make up the MRZ.
  function mrzLineConfidence(data, fallback) {
    const confs = [];
    (data.blocks || []).forEach((b) => (b.paragraphs || []).forEach((p) => (p.lines || []).forEach((l) => {
      const txt = MRZ.clean(l.text);
      if (txt.length >= 28 && (txt.includes("<<") || /[0-9]{6}/.test(txt))) confs.push(l.confidence);
    })));
    if (!confs.length) return Math.round(fallback || 0);
    return Math.round(confs.reduce((a, b) => a + b, 0) / confs.length);
  }

  async function scan(src, onProgress) {
    progressCb = onProgress || (() => {});
    const t0 = performance.now();
    progressCb({ status: "loading lib", progress: 0 });
    const img = await loadImage(src);
    const w = await getWorker();
    const portrait = (img.naturalHeight || img.height) > (img.naturalWidth || img.width) * 1.15;
    const attempts = [{ bottom: 0.38 }, { bottom: 0.6 }, { bottom: 1 }];
    if (portrait) attempts.push({ bottom: 0.45, rotate: 90 }, { bottom: 0.45, rotate: -90 });
    let best = null;
    for (let i = 0; i < attempts.length; i++) {
      progressCb({ status: "attempt", attempt: i + 1, total: attempts.length, progress: 0 });
      const canvas = prepare(img, attempts[i]);
      const { data } = await w.recognize(canvas, {}, { text: true, blocks: true });
      const parsed = MRZ.fromText(data.text);
      if (parsed) {
        parsed.ocrConfidence = mrzLineConfidence(data, data.confidence);
        parsed.rawText = data.text;
        if (!best || parsed.checksPassed > best.checksPassed) best = parsed;
        if (parsed.valid) break;
      }
    }
    if (!best) throw Object.assign(new Error("no mrz"), { code: "NO_MRZ" });
    best.engine = engine;
    best.ms = Math.round(performance.now() - t0);
    return best;
  }

  // General Korean text recognition (사업자등록증). Separate worker with the stock kor+eng models.
  let textWorker = null;
  async function readText(src, onProgress) {
    progressCb = onProgress || (() => {});
    const img = await loadImage(src);
    const T = await loadLib();
    if (!textWorker) {
      try { textWorker = await withTimeout(T.createWorker(["kor", "eng"], 1, { logger }), 90000, "OFFLINE"); }
      catch (e) { textWorker = null; throw Object.assign(new Error("engine load failed"), { code: "OFFLINE" }); }
      await textWorker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
    }
    // drop light colours (watermarks, coloured backgrounds) before reading: keep only dark ink
    const c = document.createElement("canvas");
    const sc = Math.min(2, 2000 / Math.max(img.naturalWidth || img.width, 1));
    c.width = Math.round((img.naturalWidth || img.width) * sc); c.height = Math.round((img.naturalHeight || img.height) * sc);
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height);
    const px = g.getImageData(0, 0, c.width, c.height), d = px.data;
    for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; const v = y < 150 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; }
    g.putImageData(px, 0, 0);
    const { data } = await textWorker.recognize(c);
    return data.text || "";
  }

  return { scan, readText, loadLib, prepare, get engine() { return engine; } };
})();

function statusBadge(kind) {
  const map = {
    ok: ["ok", "✓ " + t("verified")],
    fail: ["bad", "✗ " + t("checkFail")],
    nocheck: ["info", t("noCheck")],
    fixed: ["warn", "⚠ " + t("corrected")],
    edited: ["info", "✎ " + t("edited")],
  };
  const [cls, label] = map[kind];
  return `<span class="fstat ${cls}">${label}</span>`;
}

function reviewHtml() {
  const r = state.ocr.result, v = state.ocr.review;
  if (!r || !v) return "";
  const fixed = new Set(r.corrections.map((c) => c.field));
  const st = (field, checkKey) => {
    if (v._edited && v._edited[field]) return statusBadge("edited");
    if (!checkKey) return statusBadge(fixed.has(field) ? "fixed" : "nocheck");
    if (!r.checks[checkKey]) return statusBadge("fail");
    return statusBadge(fixed.has(checkKey) ? "fixed" : "ok");
  };
  const realFixes = r.corrections.filter((c) => c.field !== "line2").length;
  let banner;
  if (!r.valid) banner = `<div class="conf low">${tf("confLow", { ok: r.checksPassed, total: r.checksTotal })}</div>`;
  else if (realFixes) banner = `<div class="conf mid">${tf("confMid", { n: realFixes })}</div>`;
  else banner = `<div class="conf high">${tf("confHigh", { ok: r.checksPassed, total: r.checksTotal })}</div>`;
  const warn = r.warnings.includes("expired")
    ? `<div class="conf low">${tf("expired", { date: r.fields.expiryDate })}</div>`

    <div class="form" style="padding:12px 0 0">
      ${inp("surname", t("surname"))}

      <div class="field"><label>${t("sex")} ${st("sex")}</label>

const OCR_STEPS = {
  "loading tesseract core": "ocrLoadingLib",
  "initializing tesseract": "ocrLoadingLib",
  "loading language traineddata": "ocrLoadingModel",
  "initializing api": "ocrLoadingModel",
  "recognizing text": "ocrReading",
};

async function runOcr() {
  if (!state.passportSource) { toast(t("needPhoto")); return; }
  if (state.ocr.status === "running") return;
  state.ocr = { status: "running", step: t("ocrLoadingLib"), progress: 0.02, result: null, review: null, error: null };
  render();
  let attemptLabel = "";
  try {
    const result = await OCR.scan(state.passportSource, (m) => {
      if (m.status === "attempt") {
        attemptLabel = m.attempt > 1 ? ` · ${t("ocrAttempt")} (${m.attempt}/${m.total})` : "";
        state.ocr.step = t("ocrReading") + attemptLabel;
        state.ocr.progress = 0;
      } else if (OCR_STEPS[m.status]) {
        state.ocr.step = t(OCR_STEPS[m.status]) + (m.status === "recognizing text" ? attemptLabel : "");
        state.ocr.progress = m.progress || 0;
      } else return;
      updateOcrPanel();
    });
    const f = result.fields;
    state.ocr = {
      status: "done", step: "", progress: 1, result, error: null,
      review: {
        surname: f.surname, givenNames: f.givenNames, passportNumber: f.passportNumber,
        nationality: MRZ.countryName(f.nationality, "en"), birthDate: f.birthDate || "",
        sex: f.sex, expiryDate: f.expiryDate || "", _edited: {},
      },
    };
    render();
    const card = $("#ocrReview");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    console.warn("[OCR]", e);
    const code = e && e.code;
    state.ocr = {
      status: code === "OFFLINE" ? "offline" : "error", step: "", progress: 0, result: null, review: null,
      error: code === "NO_MRZ" ? t("ocrNoMrz") : code === "IMAGE" ? t("imageLoadFail") : t("ocrError"),
    };
    render();
  }
}

function applyOcr() {
  const v = state.ocr.review;
  if (!v) return;
  state.form = {
    ...state.form,
    name: [v.surname, v.givenNames].filter(Boolean).join(" ").trim(),
    passport: (v.passportNumber || "").toUpperCase(),
    nationality: v.nationality,
    birth: v.birthDate,
    sex: v.sex,
    expiry: v.expiryDate,
  };
  state.ocr = { ...state.ocr, status: "applied", review: null };
  render();
  toast(t("ocrApplied"), 2600);
  const form = $("#registerForm");
  if (form) {
    form.scrollIntoView({ behavior: "smooth", block: "start" });
    const phone = form.querySelector('[name="phone"]');
    if (phone && !phone.value) setTimeout(() => phone.focus({ preventScroll: true }), 400);
  }
}

// Shrink a photo for the on-device preview / localStorage (full image is kept in memory only for OCR).
function makeThumb(src, maxW = 640) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s);
      c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { resolve(c.toDataURL("image/jpeg", 0.72)); } catch (e) { resolve(src); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// ---------- navigation stack (drill-down screens) ----------
// Every push() remembers where you were (and the scroll position); back() returns there.
const NAV_KEYS = ["screen", "tab", "helpCategory", "matchExpert", "helpFromSanjae", "sjStep", "sjItemId", "dirList", "dirId", "expertRef", "reqIdx", "emgKind", "emgInfoId"];
state.nav = [];
const clone = (v) => (v && typeof v === "object" ? JSON.parse(JSON.stringify(v)) : v);
function scrollTop0() { const sc = $("#app .screen"); if (sc) sc.scrollTop = 0; }
function push(screen, extra = {}) {
  const snap = {};
  NAV_KEYS.forEach((k) => { snap[k] = clone(state[k]); });
  const sc = $("#app .screen");
  snap._scroll = sc ? sc.scrollTop : 0;
  state.nav.push(snap);
  if (state.nav.length > 40) state.nav.shift();
  Object.assign(state, extra, { screen });
  render();
  scrollTop0();
}
function replaceScreen(screen, extra = {}) {
  Object.assign(state, extra, { screen });
  render();
  scrollTop0();
}
function resetNav() { state.nav = []; }
function back() {
  stopSpeech();
  const prev = state.nav.pop();
  if (prev) {
    NAV_KEYS.forEach((k) => { state[k] = prev[k]; });
    lastViewKey = null;
    render();
    const sc = $("#app .screen");
    if (sc && prev._scroll) sc.scrollTop = prev._scroll;
    return;
  }
  // No history (e.g. opened from a preview link): go to the logical parent.
  const s = state.screen;
  const found = s === "sanjae-item" ? sjFindItem(state.sjItemId) : null;
  const parent = {
    "sanjae-step": "sanjae", "sanjae-docs": "sanjae", "sanjae-contacts": "sanjae",
    "sanjae-item": found && found.step < 0 ? "sanjae-docs" : "sanjae-step",
    "dir-list": "directory", "dir-detail": "directory",
    "emergency-call": "emergency", "emg-info": "emergency", expert: "matching",
    "shop-list": "shop", "shop-item": "shop-list", "shop-form": "shop-item", "shop-checkout": "shop-form", "shop-done": "shop", "shop-orders": "shop", "shop-order": "shop-orders",
  }[s];
  if (found && found.step >= 0) state.sjStep = found.step;
  if (parent) { state.screen = parent; render(); scrollTop0(); return; }
  if (s === "register") go(state.user ? "app" : "auth");
  else if (s === "auth") go(null);
  else if (["help-form", "matching", "request"].includes(s)) { state.tab = "help"; go("app"); }
  else go(state.user ? "app" : "auth");
}

const DIR_FAV_KEY = "mpg_dir_fav";
const DIR_AREA_KEY = "mpg_dir_area";
const dirTxt = (o) => (o && (o[state.lang] || (state.lang !== "ko" && o.en) || o.ko)) || "";
const dirCatOf = (id) => DIR_CATS.find((c) => c.id === id) || DIR_CATS[0];
const dirSidoLabel = (id) => { const s = DIR_SIDO.find((x) => x.id === id); return s ? (state.lang === "ko" ? s.id : s.en) : id; };
const dirTel = (n) => "tel:" + n.replace(/[^0-9+]/g, "");
function saveDirFav() { safeSet(DIR_FAV_KEY, JSON.stringify(state.dirFav)); }
// Help category → most relevant directory category
const DIR_CAT_FOR_HELP = { accident: "comwel", wage: "labor", transfer: "labor", visa: "immigration", legal: "hotline", gov: "local" };

// "부여 한들농장" → ["부여", "한들농장"]; "영월군" → "영월"
const DIR_SIDO_ALIAS = {
  서울특별시: "서울", 서울시: "서울", 부산광역시: "부산", 대구광역시: "대구", 인천광역시: "인천", 대전광역시: "대전",
  울산광역시: "울산", 세종특별자치시: "세종", 세종시: "세종", 경기도: "경기", 강원도: "강원", 강원특별자치도: "강원",
  충청북도: "충북", 충청남도: "충남", 전라북도: "전북", 전북특별자치도: "전북", 전라남도: "전남광주", 전남: "전남광주",
  광주광역시: "전남광주", 전남광주통합특별시: "전남광주", 경상북도: "경북", 경상남도: "경남", 제주도: "제주", 제주특별자치도: "제주",
};
const dirNorm = (s) => String(s || "").replace(/\s+/g, "").toLowerCase();
const dirStrip = (s) => { const v = dirNorm(s); return v.length > 2 ? v.replace(/(특별자치시|특별자치도|광역시|특별시|시|군|구)$/, "") : v; };
function dirAreaTokens(text) {
  return String(text || "").split(/[\s,·/()]+/).map((w) => w.trim()).filter((w) => w.length >= 2);
}
function dirNearInfo(text) {
  const tokens = dirAreaTokens(text);
  const sidos = new Set();
  const direct = new Set();
  tokens.forEach((w) => {
    const alias = DIR_SIDO_ALIAS[w.replace(/\s/g, "")];
    if (alias) sidos.add(alias);
    if (DIR_SIDO.some((s) => s.id === w)) sidos.add(w);
  });
  const stems = tokens.map(dirStrip).filter((w) => w.length >= 2);
  const hit = (k) => stems.some((w) => k === w || k.startsWith(w));
  const located = new Set(); // 시도 of offices located in the matched 시군
  const servedBy = {};       // fallback: 시도 votes from offices whose 관할 covers it
  DIRECTORY.forEach((e) => {
    if (e.national) return;
    const keys = [e.sgg, ...(e.areas || [])].filter(Boolean).map(dirStrip);
    if (!keys.some(hit)) return;
    direct.add(e.id);
    if (e.sgg && hit(dirStrip(e.sgg))) located.add(e.sido);
    else if (e.cat !== "immigration") servedBy[e.sido] = (servedBy[e.sido] || 0) + 1; // immigration 관할 spans provinces
  });
  if (located.size) located.forEach((x) => sidos.add(x));
  else if (!sidos.size) {
    const best = Object.entries(servedBy).sort((x, y) => y[1] - x[1])[0];
    if (best) sidos.add(best[0]);
  }
  return { tokens, direct, sidos, ok: direct.size > 0 || sidos.size > 0 };
}
function dirArea() {
  return (state.dirArea || (state.user && state.user.workplace) || "").trim();
}
function dirHaystack(e) {
  const cat = dirCatOf(e.cat);
  return dirNorm([e.name.ko, e.name.en, e.sido, dirSidoLabel(e.sido), e.sgg, ...(e.areas || []), e.addr,
    e.serves && e.serves.ko, e.serves && e.serves.en, e.note && e.note.ko, e.note && e.note.en, I18N.ko[cat.key], I18N.en[cat.key], t(cat.key), DIR_KEYWORDS[e.cat],
    ...e.phones.map((p) => p.n + " " + p.n.replace(/-/g, "") + " " + p.ko + " " + p.en)].join(" "));
}

// Regional entries sorted with direct 관할 hits first. list = { kind: "cat"|"sido"|"fav"|"near", cat, sido, sgg }
function dirListEntries(list) {
  const L = list || {};
  if (L.kind === "fav") return DIRECTORY.filter((e) => state.dirFav.includes(e.id));
  if (L.kind === "cat") {
    const own = DIRECTORY.filter((e) => e.cat === L.cat);
    const rel = DIRECTORY.filter((e) => e.national && e.cat !== L.cat && (e.rel || []).includes(L.cat));
    return [...own.filter((e) => e.national), ...rel, ...own.filter((e) => !e.national)];
  }
  if (L.kind === "sido") {
    return DIRECTORY.filter((e) => !e.national && e.sido === L.sido &&
      (!L.sgg || e.sgg === L.sgg || (e.areas || []).includes(L.sgg)));
  }
  if (L.kind === "near") {
    const near = dirNearInfo(dirArea());
    if (!near.ok) return [];
    return DIRECTORY.filter((e) => !e.national && (!L.cat || e.cat === L.cat) && (near.direct.has(e.id) || near.sidos.has(e.sido)))
      .sort((a, b) => (near.direct.has(b.id) ? 1 : 0) - (near.direct.has(a.id) ? 1 : 0));
  }
  return [];
}
function dirSearch(q) {
  const words = dirNorm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return DIRECTORY.filter((e) => { const h = dirHaystack(e); return words.every((w) => h.includes(w)); });
}
function dirWhere(e) {
  return e.national && !e.sido ? t("dirNational") : `${dirSidoLabel(e.sido)} ${e.sgg || ""}`.trim();
}
function dirRow(e, hit) {

}

// ---------- 긴급 신고 SOS (112 / 119) ----------
// Honest by design: a normal phone call can't carry the nationality, so the app builds a Korean
// script to show or play aloud during the call. Nothing is sent automatically.
const EMG_NAT_KEY = "mpg_emg_nat";
state.emgKind = "119";
state.emgSits = [];
state.emgEng = false;
state.emgLoc = "";
state.emgNatOpen = false;
state.emgNat = safeGet(EMG_NAT_KEY, "") || "";
const emgTxt = (o) => (o && (o[state.lang] || (state.lang !== "ko" && o.en) || o.ko)) || "";
// → { nat, from: "chosen" | "profile" | "unknown" | "default" }
function emgNation() {
  const chosen = state.emgNat && EMG_NATIONS.find((n) => n.id === state.emgNat);
  if (chosen) return { nat: chosen, from: "chosen" };
  const prof = state.user && emgMatchNation(state.user.nationality);
  if (prof) return { nat: prof, from: "profile" };
  return { nat: EMG_NATIONS[0], from: state.user && state.user.nationality ? "unknown" : "default" };
}
function emgOpts() {
  const u = state.user || {};
  return { nat: emgNation().nat, sits: state.emgSits, name: u.name, workplace: u.workplace, loc: state.emgLoc, english: state.emgEng };
}
const emgMineLang = () => (state.lang === "ko" ? "en" : state.lang);
const emgLinesHtml = (lines) => lines.map((l) => `<p>${esc(l)}</p>`).join("");
function emgSmsHref(kind) {
  const ko = emgScript(emgOpts(), "ko");
  return `sms:${kind}?&body=${encodeURIComponent(emgSmsBody(ko, !!String(state.emgLoc || "").trim()))}`;
}
// Refresh only the script + sms link (keeps focus in the location field while typing).
function emgUpdateScript() {
  const ko = $("#emgScriptKo"), mine = $("#emgScriptMine"), sms = $("#emgSms");
  if (ko) ko.innerHTML = emgLinesHtml(emgScript(emgOpts(), "ko"));
  if (mine) mine.innerHTML = emgLinesHtml(emgScript(emgOpts(), emgMineLang()));
  if (sms) sms.setAttribute("href", emgSmsHref(state.emgKind));
}

let emgSpeaking = false;
function emgSpeechSupported() {
  try { return !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function"; } catch (e) { return false; }
}
function stopSpeech() {
  try { if (emgSpeaking && emgSpeechSupported()) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  emgSpeaking = false;
}
function emgSpeak() {
  const btn = $("#emgSpeak"), msg = $("#emgSpeakMsg");
  const setMsg = (k) => { if (msg) msg.textContent = t(k); };
  const label = () => { const b = $("#emgSpeak"); if (b) b.textContent = t(emgSpeaking ? "emgSpeakStop" : "emgSpeak"); };
  if (!emgSpeechSupported()) { if (btn) btn.disabled = true; setMsg("emgSpeakNo"); return; }
  if (emgSpeaking) { stopSpeech(); label(); return; }
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new window.SpeechSynthesisUtterance(emgScript(emgOpts(), "ko").join(" "));
    u.lang = "ko-KR";
    u.rate = 0.85;
    const voices = (typeof synth.getVoices === "function" && synth.getVoices()) || [];
    const ko = voices.find((v) => /^ko([-_]|$)/i.test(v.lang || ""));
    if (ko) u.voice = ko;
    else if (voices.length) setMsg("emgSpeakNoVoice");
    u.onend = u.onerror = () => { emgSpeaking = false; label(); };
    emgSpeaking = true;
    label();
    synth.speak(u);
  } catch (e) {
    emgSpeaking = false;
    label();
    setMsg("emgSpeakNo");
  }
}
